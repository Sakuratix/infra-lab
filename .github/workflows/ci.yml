name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff pytest
      - run: ruff check . && ruff format --check .
      - run: pytest -q app/tests
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: app/Dockerfile }

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt & validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - uses: azure/setup-helm@v4
      - name: helm lint & template
        run: |
          helm lint helm/app
          helm template demo helm/app --set ingress.enabled=true > /dev/null
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ansible syntax check
        working-directory: ansible
        run: |
          pip install ansible-core yamllint
          ansible-galaxy collection install community.general
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" .
          ansible-playbook --syntax-check -i inventory.example.ini site.yml

  image:
    needs: [app, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:${{ github.sha }}"
