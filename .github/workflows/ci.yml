name: ci

# Shared checks come from github.com/Sakuratix/platform-ci (pinned to its v1 major tag),
# repo-specific ones live here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff pytest
      - run: ruff check . && ruff format --check .
      - run: pytest -q app/tests

  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: yamllint + syntax check
        run: |
          pip install ansible-core yamllint
          ansible-galaxy collection install community.general
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" .
          ansible-playbook --syntax-check -i inventory.example.ini site.yml

  monitoring:
    # Alert rules are code: lint them and unit-test that each one fires when it should.
    runs-on: ubuntu-latest
    env:
      PROMTOOL: docker run --rm -v ${{ github.workspace }}:/w -w /w --entrypoint promtool prom/prometheus:v3.1.0
    steps:
      - uses: actions/checkout@v4
      - run: $PROMTOOL check rules monitoring/alerts.yml
      - run: $PROMTOOL test rules monitoring/tests/alerts_test.yml

  terraform:
    uses: Sakuratix/platform-ci/.github/workflows/terraform.yml@v1
    with:
      working-directory: terraform
    permissions:
      contents: read
      pull-requests: write

  helm:
    uses: Sakuratix/platform-ci/.github/workflows/helm.yml@v1
    with:
      chart: helm/app
      set: ingress.enabled=true serviceMonitor.enabled=true

  deploy-smoke:
    # The chart is linted elsewhere; this proves it actually comes up: build the
    # image, install the chart into a throwaway kind cluster with --wait, hit the
    # endpoints. If anything is unhealthy, kubectl-why explains it in the job summary.
    needs: [app, helm]
    runs-on: ubuntu-latest
    env:
      RELEASE: lab
      NS: infra-lab
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: { cluster_name: smoke }
      - name: build and load the image
        run: |
          docker build -t infra-lab:smoke app
          kind load docker-image infra-lab:smoke --name smoke
      - name: install kubectl-why (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          base=https://github.com/Sakuratix/kubectl-why/releases/latest/download
          curl -sSfLO "$base/kubectl-why_linux_amd64.tar.gz"
          curl -sSfLO "$base/checksums.txt"
          grep ' kubectl-why_linux_amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar xzf kubectl-why_linux_amd64.tar.gz kubectl-why
          sudo install kubectl-why /usr/local/bin/
      - name: helm install --wait
        run: |
          helm upgrade --install "$RELEASE" helm/app -n "$NS" --create-namespace \
            --set image.repository=infra-lab --set image.tag=smoke --set image.pullPolicy=Never \
            --wait --timeout 3m
      - name: smoke test through the Service
        run: |
          kubectl -n "$NS" port-forward "svc/$RELEASE-infra-lab" 8080:80 &
          for _ in $(seq 20); do curl -sf localhost:8080/readyz && break; sleep 1; done
          curl -sf localhost:8080/healthz
          root=$(curl -sf localhost:8080/) && [[ $root == *'"service": "infra-lab"'* ]]
          metrics=$(curl -sf localhost:8080/metrics) && grep -q '^http_requests_total' <<<"$metrics"
      - name: kubectl why
        if: always()
        run: |
          {
            echo "## Deploy smoke test"
            kubectl why "deploy/$RELEASE-infra-lab" -n "$NS" -o markdown
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: [app, ansible, monitoring, terraform, helm, deploy-smoke]
    uses: Sakuratix/platform-ci/.github/workflows/docker.yml@v1
    with:
      context: app
    permissions:
      contents: read
      packages: write
      id-token: write
