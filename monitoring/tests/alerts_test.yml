# Unit tests for monitoring/alerts.yml: promtool test rules monitoring/tests/alerts_test.yml
# Each case feeds synthetic series and checks the alert fires (or stays quiet) when it should.
rule_files: [../alerts.yml]
evaluation_interval: 1m

tests:
  - name: AppDown fires after 1m of up == 0, not before
    interval: 1m
    input_series:
      - series: 'up{job="app",instance="app:8080"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - { eval_time: 2m, alertname: AppDown, exp_alerts: [] }   # pending
      - eval_time: 4m
        alertname: AppDown
        exp_alerts:
          - exp_labels: { severity: critical, job: app, instance: "app:8080" }
            exp_annotations: { summary: "app is down on app:8080" }

  - name: 10% errors pages within minutes (fast burn)
    interval: 1m
    input_series:
      - { series: 'http_requests_total{method="GET",path="/",status="200"}', values: "0+90x60" }
      - { series: 'http_requests_total{method="GET",path="/",status="500"}', values: "0+10x60" }
    alert_rule_test:
      - eval_time: 10m
        alertname: ErrorBudgetBurnFast
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "error budget burning 14x too fast (10% errors over 1h)" }

  - name: 4% errors opens a ticket, does not page (slow burn)
    interval: 1m
    input_series:
      - { series: 'http_requests_total{method="GET",path="/",status="200"}', values: "0+96x120" }
      - { series: 'http_requests_total{method="GET",path="/",status="500"}', values: "0+4x120" }
    alert_rule_test:
      - { eval_time: 90m, alertname: ErrorBudgetBurnFast, exp_alerts: [] }
      - eval_time: 90m
        alertname: ErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "error budget burning 6x too fast (4% errors over 6h)" }

  - name: 1% errors is within budget, nothing fires
    interval: 1m
    input_series:
      - { series: 'http_requests_total{method="GET",path="/",status="200"}', values: "0+99x120" }
      - { series: 'http_requests_total{method="GET",path="/",status="500"}', values: "0+1x120" }
    alert_rule_test:
      - { eval_time: 90m, alertname: ErrorBudgetBurnFast, exp_alerts: [] }
      - { eval_time: 90m, alertname: ErrorBudgetBurnSlow, exp_alerts: [] }

  - name: a 3-minute error spike does not page
    interval: 1m
    input_series:
      - { series: 'http_requests_total{method="GET",path="/",status="200"}', values: "0+100x60" }
      - { series: 'http_requests_total{method="GET",path="/",status="500"}', values: "0x40 0+50x3 150x16" }
    alert_rule_test:
      - { eval_time: 60m, alertname: ErrorBudgetBurnFast, exp_alerts: [] }

  - name: no traffic is not an outage
    interval: 1m
    input_series:
      - { series: 'http_requests_total{method="GET",path="/",status="200"}', values: "0x60" }
    alert_rule_test:
      - { eval_time: 30m, alertname: ErrorBudgetBurnFast, exp_alerts: [] }
      - { eval_time: 30m, alertname: ErrorBudgetBurnSlow, exp_alerts: [] }

  - name: HighLatencyP95 fires when most requests take 0.5-1s
    interval: 1m
    input_series:
      - { series: 'http_request_duration_seconds_bucket{le="0.25"}', values: "0+5x30" }
      - { series: 'http_request_duration_seconds_bucket{le="0.5"}', values: "0+10x30" }
      - { series: 'http_request_duration_seconds_bucket{le="1.0"}', values: "0+100x30" }
      - { series: 'http_request_duration_seconds_bucket{le="+Inf"}', values: "0+100x30" }
    alert_rule_test:
      - { eval_time: 5m, alertname: HighLatencyP95, exp_alerts: [] }   # pending, needs 10m
      - eval_time: 15m
        alertname: HighLatencyP95
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "p95 latency above 500ms" }
