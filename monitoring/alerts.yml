groups:
  - name: app
    rules:
      - alert: AppDown
        expr: up{job="app"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "app is down on {{ $labels.instance }}"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "more than 5% of requests fail"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency above 500ms"
