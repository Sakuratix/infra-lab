name: ci

# Shared checks come from github.com/Sakuratix/platform-ci (switch @main to @v1 once that tag exists),
# repo-specific ones live here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff pytest
      - run: ruff check . && ruff format --check .
      - run: pytest -q app/tests

  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: yamllint + syntax check
        run: |
          pip install ansible-core yamllint
          ansible-galaxy collection install community.general
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" .
          ansible-playbook --syntax-check -i inventory.example.ini site.yml

  terraform:
    uses: Sakuratix/platform-ci/.github/workflows/terraform.yml@main
    with:
      working-directory: terraform
    permissions:
      contents: read
      pull-requests: write

  helm:
    uses: Sakuratix/platform-ci/.github/workflows/helm.yml@main
    with:
      chart: helm/app
      set: ingress.enabled=true serviceMonitor.enabled=true

  image:
    needs: [app, ansible, terraform, helm]
    uses: Sakuratix/platform-ci/.github/workflows/docker.yml@main
    with:
      context: app
    permissions:
      contents: read
      packages: write
      id-token: write
